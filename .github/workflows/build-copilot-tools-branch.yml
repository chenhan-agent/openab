name: Build Copilot Tools Branch Image

on:
  push:
    branches:
      - tools
    paths:
      - .github/workflows/build-copilot-tools-branch.yml
      - Dockerfile.copilot
      - Cargo.toml
      - Cargo.lock
      - crates/**
  workflow_dispatch:

concurrency:
  group: build-copilot-tools-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/chenhan-agent/openab-copilot-tools

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.copilot
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:tools
            ${{ env.IMAGE_NAME }}:tools-${{ github.sha }}
          cache-from: type=gha,scope=copilot-tools-linux-amd64
          cache-to: type=gha,scope=copilot-tools-linux-amd64,mode=max
